# Every push: the contract's unit tests, the game engine's tests, type checks and a production build, then a
# read-only check of the README's claims against NEAR testnet and the live site (npm run verify).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            contract/target
          key: cargo-${{ hashFiles('contract/Cargo.lock') }}
      - run: cargo test
      # the contract also builds for the chain (wasm32), not only for the unit tests
      - run: rustup target add wasm32-unknown-unknown && cargo build --release --target wasm32-unknown-unknown
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx eslint . --max-warnings 20
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npx vite build
  verify:
    needs: [contract, app]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run verify
