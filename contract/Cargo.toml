[package]
name = "heat-index-contract"
version = "0.1.0"
edition = "2021"
description = "HEAT INDEX on NEAR: credits and robots as NEP-245 multi tokens, trades and battle results on-chain"
license = "MIT"
repository = "https://github.com/Ginger-Box/Heat-Index"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
